<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">    
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="styles/motif.css" rel="stylesheet" />
    <script type="text/javascript" src="src/motif_utils.js"></script>
    <script type="text/javascript" src="src/motif_lexer.js"></script>
    <script type="text/javascript" src="src/motif_runtime.js"></script>
    <script type="text/javascript" src="display.js"></script>
</head>
<body>
    <div id="cover_stripes"></div>
    <div id="cover_static"></div>
    <div id="cover_burnin" inert></div>
    <div id="content" class="content">
        <div id="inner_content" class="inner_content">
            <div id="menu" class="menu">
                <div id="menu_header" class="menu_header">
                    <div style="text-align: center; width: 100%">&#x21C4; MOTIF &#x21BB;</div>
                    &nbsp;<br/>
                    Daniel Temkin, 2025ish<br/>
                    <span style="font-size: 80%">
                    from <a href="https://mitpress.mit.edu/9780262553087/forty-four-esolangs/">Forty-Four Esolangs</a><br/>(2025, MIT Press)</span>
                </div>
                <div id="options" class="options">
                    <div id="loaders" class="loaders">
                        MENU<br/>
                        <input type="button" id="load_program" value="load program" onclick="runtime.loadProgram()" /><br/>
                        <div id="load_example" class="dropdown" data-value="none">
                            <div class="dropdown_button" tabindex="0" role="combobox" aria-label="load example" aria-haspopup="listbox" aria-expanded="false" aria-controls="load_example_list">load example</div>
                            <ul id="load_example_list" class="dropdown_list" role="listbox" hidden>
                                <li id="load_example_none" role="option" data-value="none" aria-selected="true" aria-disabled="true" disabled>load example</li>
                                <li id="load_example_hello_world" role="option" data-value="hello_world" aria-selected="false">Hello, World!</li>
                            </ul>
                        </div>
                    </div>
                </div>
                <div id="stacks" class="stacks">STATE</div>
                <div id="output">OUTPUT</div>
            </div>
            <div id="main_holder" class="main_holder">
            <div id="main" class="main"><div></div><div class="header">MOTIF console. enter motif code, or <a href="/Motif/Language/">read more here</a></div></div>
            </div>  
        </div>
    </div>
</body>
</html>
